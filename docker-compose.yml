services:
  postgres:
    image: postgres:16
    container_name: roost-postgres
    environment:
      POSTGRES_USER: roost_user
      POSTGRES_PASSWORD: roost_pass
      POSTGRES_DB: roost_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: "./"
      dockerfile: Dockerfile
    container_name: roost-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/roost_db
      SPRING_DATASOURCE_USERNAME: roost_user
      SPRING_DATASOURCE_PASSWORD: roost_pass
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: roost-client
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  pgdata: